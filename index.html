function automations(items,filter='all',query=''){const list=items.filter(a=>(filter==='all'||a.status===filter)&&`${a.name} ${a.description}`.toLowerCase().includes(query.toLowerCase()));return heading('Automations','The workflows that keep your business moving.',`<button class="btn primary" data-action="new-automation">${icon('plus',15)} New automation</button>`)+`<div class="toolbar"><div class="input-search">${icon('search',15)}<input aria-label="Search automations" placeholder="Search automations…" id="automation-search" value="${e(query)}"></div><div class="filter-tabs" aria-label="Filter automations">${['all','active','draft'].map(f=>`<button class="${f===filter?'active':''}" aria-pressed="${f===filter}" data-action="automation-filter" data-filter="${f}">${f[0].toUpperCase()+f.slice(1)}</button>`).join('')}</div></div><div class="automation-cards">${list.map(a=>`<article class="automation-card panel"><div class="card-top"><div class="float-icon">${icon('flow',20)}</div>${badge(a.status)}</div><div><h2>${e(a.name)}</h2><p>${e(a.description)}</p></div><div class="card-stats"><span><strong>${a.steps.length}</strong>steps</span><span><strong>${a.runs}</strong>runs</span></div><div class="card-bottom"><a href="#/app/automations/${e(a.id)}">Open workflow ${icon('arrow',12)}</a><button class="icon-button" data-action="delete-automation" data-id="${e(a.id)}" aria-label="Delete ${e(a.name)}">${icon('trash',14)}</button></div></article>`).join('')}${!query&&filter==='all'?'<button class="automation-card panel add-card" data-action="new-automation"><span class="icon-button">'+icon('plus',20)+'</span><h2>Make something work for you.</h2><p>Start a workflow and shape it around your business.</p></button>':''}</div>${!list.length?'<div class="empty"><h2>No matching automations</h2><p>Try a different search or create a new workflow.</p></div>':''}`;}
function flowMarkup(automation,selected,zoom){const nodes=automation.steps;let edges='';for(const node of nodes)for(const next of node.next??[]){const target=nodes.find(n=>n.id===next);if(!target)continue;const startX=node.x+114,startY=node.y+76,endX=target.x+114,endY=target.y;edges+=`<path d="M ${startX} ${startY} V ${(startY+endY)/2} H ${endX} V ${endY}"/>`;if(node.type==='decision')edges+=`<text x="${endX+9}" y="${endY-12}">${node.id==='route'?(target.id==='details'?'BOOKING':target.id==='human'?'SUPPORT':'FAQ'):target.id==='alternative'?'NO':'YES'}</text>`;}

ng>${node.type==='ai'?'AI quality check':'Workflow configuration'}</strong>${node.type==='ai'?'Use only approved business knowledge. Sensitive requests should be routed to a person.':'Changes apply to your draft. Save the workflow before publishing. Integrations execute on your backend.'}</div></form>`;}

function inbox(items,selected,query=''){const list=items.filter(c=>`${c.name} ${c.topic}`.toLowerCase().includes(query.toLowerCase()));const current=items.find(c=>c.id===selected)??list[0];return heading('Inbox','The context your team needs. All in one conversation.')+`<section class="panel inbox-layout"><aside class="conversation-list" aria-label="Conversations"><div class="input-search">${icon('search',14)}<input id="inbox-search" aria-label="Search conversations" placeholder="Search conversations…" value="${e(query)}"></div>${list.map(c=>`<a class="conversation-item ${c.id===current?.id?'active':''}" href="#/app/inbox/${e(c.id)}"><span class="avatar">${initials(c.name)}</span><div><strong>${e(c.name)}</strong><p>${e(c.topic)}</p>${badge(c.status)}</div></a>`).join('')}${!list.length?'<div class="empty">No matching conversations.</div>':''}</aside><div class="conversation-thread">${current?`<header class="thread-header"><span class="avatar">${initials(current.name)}</span><div><strong>${e(current.name)}</strong><small>WhatsApp · ${e(current.topic)}</small></div>${current.status==='resolved'?badge('resolved'):`<button class="btn" data-action="resolve-conversation" data-id="${e(current.id)}">${icon('check',13)} Resolve</button>`}</header><div class="messages">${current.messages.map(m=>`<div class="message ${e(m.from)}"><div>${e(m.text)}</div><small>${m.from==='customer'?'Customer':m.from==='team'?'Your team':'AI assistant'} · ${e(m.time)}</small></div>`).join('')}</div><form class="reply-form" id="reply-form" data-id="${e(current.id)}"><input name="message" required maxlength="2000" placeholder="Reply as your team…" aria-label="Message"><button class="btn primary" type="submit">Send ${icon('arrow',13)}</button></form>`:'<div class="empty"><h2>Your inbox is clear.</h2><p>New conversations will appear here.</p></div>'}</div></section>`;}

function integrations(items){return heading('Integrations','A workspace that works with your business tools.')+`<div class="integration-grid">${items.map(item=>`<article class="panel integration-card"><div class="service-symbol" style="background:${item.color}">${e(item.symbol)}</div><h2>${e(item.name)}</h2><p>${e(item.description)}</p><div class="card-bottom">${badge(item.status)}<button class="btn soft" data-action="configure-integration" data-id="${e(item.id)}" style="font-size:10px;padding:7px 10px">Configure</button></div></article>`).join('')}</div><div class="connection-note">${icon('lock',14)} Integration credentials and provider secrets belong on your backend. This frontend never requests or stores API keys.</div>`;}

function validateFlow(){if(!workflow.steps.length)throw new Error('Add at least one step before publishing.');if(!workflow.steps.some(n=>n.type==='trigger'))throw new Error('The workflow needs an incoming message trigger.');for(const node of workflow.steps){if(!node.title.trim())throw new Error('Give every step a name.');if(node.next.some(id=>!workflow.steps.some(n=>n.id===id)))throw new Error('A step links to a missing step.');}const visited=new Set(),stack=[workflow.steps.find(n=>n.type==='trigger').id];while(stack.length){const id=stack.pop();if(visited.has(id))continue;visited.add(id);stack.push(...workflow.steps.find(n=>n.id===id).next);}if(visited.size!==workflow.steps.length)throw new Error('Some steps are disconnected from the trigger.');}

    if(form.id==='automation-form'){if(!body.name||!body.description)throw new Error('Enter a name and a description.');const item=await api.createAutomation(body);closeModal();navigate('/app/automations/'+item.id);}
    if(form.id==='step-form'){if(!body.title)throw new Error('Give this step a name.');const node=workflow.steps.find(n=>n.id===selectedStep);Object.assign(node,body);if(body.threshold!==undefined)node.threshold=Number(body.threshold);delete form.dataset.changed;markDirty();updateFlow();toast('Step updated. Save the draft to keep your changes.');}
    if(form.id==='add-step-form'){if(!body.title)throw new Error('Give your step a name.');const parent=workflow.steps.find(n=>n.id===body.parent);const id=crypto.randomUUID();const node={id,title:body.title,description:'Configure this step for your workflow',type:body.type,x:Math.min(864,parent.x+264),y:Math.max(...workflow.steps.map(n=>n.y))+128,next:[]};parent.next.push(id);workflow.steps.push(node);selectedStep=id;markDirty();closeModal();updateFlow();document.getElementById('flow-canvas').style.height=node.y+150+'px';document.getElementById('canvas-viewport').scrollTop=node.y*zoom/100-100;toast('Step added to your draft.');}
    if(form.id==='contact-form'){if(!body.name||!body.email)throw new Error('Enter a name and an email address.');if(form.dataset.id)await api.updateContact(form.dataset.id,body);else await api.createContact(body);closeModal();await render();toast('Contact saved.');}
    if(form.id==='reply-form'){if(!body.message)throw new Error('Write a message first.');await api.reply(form.dataset.id,body.message);await render();toast(api.mode==='demo'?'Demo reply saved. No WhatsApp message was sent.':'Reply submitted.');}
    if(form.id==='settings-form'){if(form.querySelector('[name=notifications]'))body.notifications=form.querySelector('[name=notifications]').checked;settings=await api.saveSettings(body);await render();toast('Settings saved.');}
  }catch(error){formError(form,error);}
  finally{if(submit?.isConnected)submit.disabled=false;}
});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'&&path().startsWith('/app/')){event.preventDefault();searchWorkspace().catch(error=>toast(error.message));}if(event.key==='Escape')document.getElementById('sidebar')?.classList.remove('open');const tab=event.target.closest('.solution-tab');if(tab&&['ArrowLeft','ArrowRight'].includes(event.key)){event.preventDefault();const next=(Number(tab.dataset.index)+(event.key==='ArrowRight'?1:2))%3;const button=document.getElementById('solution-tab-'+next);button.focus();button.click();}});
let pendingNavigation;
document.addEventListener('click',event=>{const link=event.target.closest('a[href^="#/" ]');if(!link||!dirty||link.getAttribute('href')==='#'+path())return;event.preventDefault();pendingNavigation=link.getAttribute('href').slice(1);modal('Save your workflow first?',`<p>Your current workflow has unsaved changes.</p><div class="modal-footer"><button class="btn" data-action="close-modal">Keep editing</button><button class="btn danger" id="discard-navigation">Discard changes</button><button class="btn primary" id="save-navigation">Save and leave</button></div>`);},true);
document.addEventListener('click',async event=>{if(event.target.id==='discard-navigation'){dirty=false;closeModal();navigate(pendingNavigation);}if(event.target.id==='save-navigation'){try{const form=document.getElementById('step-form');if(form?.dataset.changed){toast('Apply step changes first.');return;}await saveFlow();closeModal();navigate(pendingNavigation);}catch(error){toast(error.message);}}});
window.addEventListener('beforeunload',event=>{if(dirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('hashchange',()=>{dirty=false;render();});
render();

return {};
})();
})();
</script></body>
