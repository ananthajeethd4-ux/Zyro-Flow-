<main id="main"><section class="hero"><div class="hero-copy"><div class="pill"><i class="live-dot"></i> A little less busy. A lot more booked.</div><h1>Your front desk.<br>Always open.<br><span>Already on it.</span></h1><p>Turn WhatsApp enquiries into bookings. Zyro Flow answers questions, checks availability, and keeps your business moving—even when your team is busy.</p><div class="hero-actions"><button class="btn primary large" data-action="watch-story">Watch the midnight story ${icon('play',16)}</button><button class="btn large" data-action="enter-demo">${icon('play',15)} Try the booking demo</button></div><div class="hero-note"><span>${icon('check',12)} Built around your business</span><span>${icon('check',12)} Your team stays in control</span></div></div>
